name: Issue gate

# Closes issues from contributors who are not approved yet. Maintainers (write
# access and above) and users listed in .github/APPROVED_CONTRIBUTORS pass.
# Approval flow: CONTRIBUTING.md.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  gate:
    name: gate new issue
    runs-on: ubuntu-latest
    steps:
      - name: Close unapproved issue
        uses: actions/github-script@v9
        with:
          script: |
            const APPROVALS_PATH = '.github/APPROVED_CONTRIBUTORS';
            const VALID_CAPABILITIES = new Set(['issue', 'pr']);
            const TRUSTED_BOT_AUTHORS = new Set(['dependabot[bot]', 'github-actions[bot]']);
            const MAINTAINER_PERMISSIONS = ['admin', 'maintain', 'write'];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const author = issue.user.login;

            if (TRUSTED_BOT_AUTHORS.has(author)) {
              core.info(`Trusted bot ${author}; skipping gate.`);
              return;
            }

            if (!author.endsWith('[bot]')) {
              const permission = await getPermission(owner, repo, author);
              if (permission && MAINTAINER_PERMISSIONS.includes(permission)) {
                core.info(`${author} has ${permission} access; skipping gate.`);
                return;
              }
            }

            const capability = await approvedCapability(owner, repo, author);
            if (capability) {
              core.info(`${author} is approved for ${capability}; keeping issue open.`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                'This issue was auto-closed. All issues from new contributors are auto-closed by default.',
                '',
                'Maintainers review auto-closed issues daily and reopen the ones that meet the quality bar.',
                'If you want to raise the topic again, read [CONTRIBUTING.md](' +
                  `${context.payload.repository.html_url}/blob/${context.payload.repository.default_branch}/CONTRIBUTING.md` +
                  ') first and keep the new report short, concrete and reproducible.',
                '',
                'If a maintainer replies to one of your issues with `lgtmi` or `lgtm` in the command',
                'position, your future issues stay open (and with `lgtm`, your future PRs too).',
              ].join('\n'),
            });

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ['untriaged'],
              });
            } catch (error) {
              core.warning(`Could not add untriaged label: ${error.message}`);
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });

            async function getPermission(owner, repo, login) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: login,
                });
                return data.permission;
              } catch (error) {
                core.warning(`Cannot read repository permission for ${login}: ${error.message}`);
                return null;
              }
            }

            async function approvedCapability(owner, repo, login) {
              let text;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: APPROVALS_PATH,
                });
                text = Buffer.from(data.content, 'base64').toString('utf8');
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }

              for (const line of text.split(/\r?\n/)) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) continue;
                const tokens = trimmed.split(/\s+/);
                if (tokens.length !== 2) continue;
                const [username, rawCapability] = tokens;
                const capability = rawCapability.toLowerCase();
                if (!VALID_CAPABILITIES.has(capability)) continue;
                if (username.toLowerCase() === login.toLowerCase()) return capability;
              }
              return null;
            }
