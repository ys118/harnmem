name: Release

# Publishes @harnmem/core, @harnmem/cli, pi-harnmem and dsh-harnmem on a version tag,
# then creates the matching GitHub release from the CHANGELOG section.
# Requirements before the first release:
#   - the @harnmem npm org exists and the maintainer can publish to it;
#   - repository secret NPM_TOKEN contains an automation token with publish rights.
# Provenance is enabled via the id-token permission below.
# When NPM_TOKEN is missing the workflow still runs the full check suite and
# skips publishing (with a warning) instead of failing with ENEEDAUTH; a
# maintainer then publishes locally — see CONTRIBUTING.md. The GitHub release
# is created either way: the checks gate it, the npm publish does not.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # Manual runs and re-runs are restricted to the repository owner: write
    # collaborators must not be able to start (or re-start) a publish. Tag
    # pushes are limited to admins by the "Protect release tags" ruleset (tag
    # creation requires an admin bypass), so this guard covers the
    # workflow_dispatch entry point and re-run attempts of a release run.
    # github.actor keeps the original actor on re-runs, while
    # github.triggering_actor is the user who actually started the re-run.
    if: >-
      (github.event_name != 'workflow_dispatch' || github.actor == 'ys118') &&
      (github.run_attempt == 1 || github.triggering_actor == 'ys118')
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm eval:gate
      - name: Warn when publishing is skipped
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not configured; the packages were not published. Publish locally with 'pnpm -r publish --access public --no-git-checks' (see CONTRIBUTING.md)."
      - name: Publish packages
        if: env.NODE_AUTH_TOKEN != ''
        # Skip packages whose exact version is already on the registry: a
        # maintainer may have published locally (with OTP) right after tagging,
        # and pnpm -r publish would otherwise die on EPUBLISHCONFLICT and paint
        # the release tag red even though the release itself succeeded.
        run: |
          published=0
          for pkg in packages/*/; do
            name=$(node -p "require('./' + process.argv[1] + 'package.json').name" "$pkg")
            version=$(node -p "require('./' + process.argv[1] + 'package.json').version" "$pkg")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already published; skipping."
            else
              pnpm --filter "$name" publish --access public --no-git-checks --provenance
              published=$((published + 1))
            fi
          done
          if [ "$published" -eq 0 ]; then
            echo "::notice::Nothing to publish — every package version is already on the registry."
          fi
      - name: Create the GitHub release
        # Tag pushes only: a workflow_dispatch run has no release tag. The
        # release notes are the CHANGELOG section for the tagged version; a
        # missing or empty section is a hard error so a release can never be
        # cut with wrong notes. Creation is skipped when the release already
        # exists (re-runs stay green).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(mktemp)
          awk -v section="## [$version]" \
            'found && /^## \[/ { exit } index($0, section) == 1 { found=1 } found { print }' \
            CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section (or it is empty); refusing to create a release with wrong notes."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; skipping creation."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "HarnMem $GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --latest
          fi
