name: Feature request
description: Propose a capability, adapter or design change
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        HarnMem optimizes for local-first simplicity: plain files, no services,
        no embedding model, no runtime dependencies in the engine and CLI.
        Proposals that preserve that shape are easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-facing problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and which package/adapter is affected.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, workarounds, or simpler designs.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core engine
        - retrieval / ranking
        - write lifecycle / dedupe / consolidation
        - extraction prompts
        - new harness adapter
        - CLI / migration
        - evals
        - documentation
        - packaging / release
    validations:
      required: true
