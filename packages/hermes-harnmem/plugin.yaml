name: harnmem
version: 0.1.0
description: "HarnMem: cross-harness persistent memory for Hermes Agent — session-start recall injection, five memory tools (harnmem_write, harnmem_search, harnmem_read, harnmem_forget, harnmem_status), and bounded session-end extraction. Shares one ~/.harnmem store with the pi, Claude Code, Codex, opencode, DSH, Grok and Cursor adapters."
requires_hermes: ">=0.22.5"
external_dependencies:
  - name: node
    install: "https://nodejs.org/en/download — Node.js 22.15 or newer must be on PATH"
    check: "node --version"
